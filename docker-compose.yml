services:
  web:
    build: .
    image: request-extraction-web:latest
    container_name: request-extraction-web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
      ORACLE_USER: ${ORACLE_USER}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      ORACLE_CONNECT_STRING: ${ORACLE_CONNECT_STRING}
      ORACLE_TIMERTASK_SCHEMA: ${ORACLE_TIMERTASK_SCHEMA}
      ORACLE_ADMIN_GROUP_ID: ${ORACLE_ADMIN_GROUP_ID}
      ORACLE_COORDINATOR_GROUP_ID: ${ORACLE_COORDINATOR_GROUP_ID}
      ORACLE_STAFF_LINE_IDS: ${ORACLE_STAFF_LINE_IDS}
      ORACLE_EXCLUDED_GROUP_IDS: ${ORACLE_EXCLUDED_GROUP_IDS}
      ORG_SNAPSHOT_TTL_SECONDS: ${ORG_SNAPSHOT_TTL_SECONDS}
      TEST_ACCOUNTS_ENABLED: ${TEST_ACCOUNTS_ENABLED}
      TEST_ACCOUNTS_PASSWORD: ${TEST_ACCOUNTS_PASSWORD}
      TEST_ACCOUNT_ADMIN: ${TEST_ACCOUNT_ADMIN}
      TEST_ACCOUNT_COORDINATOR: ${TEST_ACCOUNT_COORDINATOR}
      TEST_ACCOUNT_EMPLOYEE: ${TEST_ACCOUNT_EMPLOYEE}
      INTEGRATION_LDAP_URL: ${INTEGRATION_LDAP_URL}
      INTEGRATION_LDAP_ACCESSACCOUNT_UPN: ${INTEGRATION_LDAP_ACCESSACCOUNT_UPN}
      INTEGRATION_LDAP_ACCESSACCOUNT_PWD: ${INTEGRATION_LDAP_ACCESSACCOUNT_PWD}
      INTEGRATION_LDAP_USER_BASESEARCHGROUP: ${INTEGRATION_LDAP_USER_BASESEARCHGROUP}
      INTEGRATION_LDAP_ALLOWED_GROUP_DN: ${INTEGRATION_LDAP_ALLOWED_GROUP_DN}
      RENAULT_READER_BASE_URL: ${RENAULT_READER_BASE_URL}
      BMW_READER_BASE_URL: ${BMW_READER_BASE_URL}
      BMW_READER_LANGUAGE: ${BMW_READER_LANGUAGE:-en-GB}
      RENAULT_READER_FORMAT: ${RENAULT_READER_FORMAT}
      RENAULT_READER_LANGUAGE: ${RENAULT_READER_LANGUAGE}
      RENAULT_READER_RANGE: ${RENAULT_READER_RANGE}
      RENAULT_READER_DOWNLOAD_ORIGIN: ${RENAULT_READER_DOWNLOAD_ORIGIN}
      RECONCILE_SECRET: ${RECONCILE_SECRET}
      BMW_TRANSFORMER_BASE_URL: ${BMW_TRANSFORMER_BASE_URL:-}
      MERCEDES_READER_BASE_URL: ${MERCEDES_READER_BASE_URL:-}
      MERCEDES_TRANSFORMER_BASE_URL: ${MERCEDES_TRANSFORMER_BASE_URL:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-extracciones@audatex.es}
      MAIL_SUPPORT_TO: ${MAIL_SUPPORT_TO:-DL-ESMA-D-Acciona@audatexdatos.es}
      MAIL_REDIRECT_TO: ${MAIL_REDIRECT_TO:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18.3
    container_name: request-extraction-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
